name: b2b_freshmore
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  fl_chart: ^1.1.1
  url_launcher: ^6.3.2
  encrypt: ^5.0.3
  easy_localization: ^3.0.8
  equatable: ^2.0.8
  http: ^1.6.0
  hive_ce: ^2.19.3
  http_interceptor: ^2.0.0
  connectivity_plus: ^7.0.0
  flutter_svg: ^2.2.3
  lucide_icons_flutter: ^3.1.13
  flutter_secure_storage: ^10.0.0
  dropdown_button2: ^2.3.9
  hive_ce_flutter: ^2.3.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  google_fonts: ^8.0.2
  get_it: ^9.2.1
  upgrader: ^13.2.0
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.2.2
  intl: ^0.20.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  hive_ce_generator: ^1.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/
    - assets/translations/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600

    - family: Pyidaungsu
      fonts:
        - asset: assets/fonts/Pyidaungsu-1.8.3_Regular.ttf
